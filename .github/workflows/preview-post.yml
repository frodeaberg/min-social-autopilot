name: Preview post (draft, no publish)

on:
  workflow_dispatch:
    inputs:
      post_dir:
        description: "Path to post folder (e.g. queue/001-iso9001-kvalitet)"
        required: true
        default: "queue/001-iso9001-kvalitet"

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create unpublished draft post on Facebook
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          PREVIEW_DIR: ${{ inputs.post_dir }}
        run: python3 scripts/preview_post.py
